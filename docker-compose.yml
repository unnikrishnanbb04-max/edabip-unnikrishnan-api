services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reports}
      POSTGRES_USER: ${POSTGRES_USER:-reports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-this-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reports} -d ${POSTGRES_DB:-reports}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://reports:reports@db:5432/reports}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
